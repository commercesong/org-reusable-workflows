name: Test container Terraform version interface

on:
  push:
    paths:
      - '.github/workflows/cicd-terraform-container.yml'
      - '.github/workflows/test-container-terraform-version.yml'
      - 'tests/test_container_terraform_version.py'
      - 'requirements-test.txt'
  pull_request:
    paths:
      - '.github/workflows/cicd-terraform-container.yml'
      - '.github/workflows/test-container-terraform-version.yml'
      - 'tests/test_container_terraform_version.py'
      - 'requirements-test.txt'

permissions:
  contents: read

jobs:
  interface-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Compatibility test reads the pre-extension revision.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -p 'test_container_terraform_version.py' -v
