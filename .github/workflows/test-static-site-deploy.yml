name: Test static-site upload interface

on:
  push:
    paths:
      - '.github/workflows/static-site-deploy.yml'
      - '.github/workflows/test-static-site-deploy.yml'
      - 'tests/test_static_site_uploads.py'
      - 'requirements-test.txt'
      - 'docs/static-site-s3-uploads.md'
  pull_request:
    paths:
      - '.github/workflows/static-site-deploy.yml'
      - '.github/workflows/test-static-site-deploy.yml'
      - 'tests/test_static_site_uploads.py'
      - 'requirements-test.txt'
      - 'docs/static-site-s3-uploads.md'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Compatibility test reads the pre-extension revision.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -p 'test_static_site_uploads.py' -v
